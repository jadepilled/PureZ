name: Server status

# Queries every live server in the homepage's servers.json and publishes
# status.json (current population + 7-day history) to the `status` branch,
# which purez.gg reads.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-status

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Query servers
        run: |
          git fetch --depth 1 origin gh-pages
          git show origin/gh-pages:servers.json > /tmp/servers.json
          if git fetch --depth 1 origin status 2>/dev/null; then
            git show origin/status:status.json > /tmp/status.json || true
          fi
          python3 tools/server_status.py /tmp/servers.json /tmp/status.json

      - name: Publish to status branch
        run: |
          mkdir -p /tmp/out && cp /tmp/status.json /tmp/out/ && cd /tmp/out
          git init -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "Server status"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status
